# cartoon-clipper configuration
# ==============================

# Per-show clipping settings. Episodes land in episodes/<show>/ and are
# matched here by the subfolder name. "default" applies to any show not
# listed. Adjust intro/outro to each show's real title sequence.
shows:
  default:
    intro_seconds: 3        # trim from the start (title card)
    outro_seconds: 5        # trim from the end (credits)
    scene_threshold: 0.35   # scene-change sensitivity, 0..1 (cartoons: 0.3-0.4)
    min_clip_seconds: 60    # every clip is at least this long (short scenes are merged)
    max_clip_seconds: 180   # split longer stretches into chunks this big
    attribution: ""         # appended to the YouTube description for clips from this show
  # CC-BY open movies (e.g. Blender Foundation) need credit in the description.
  # Upload those episodes into a "blender" subfolder of the Drive folder so
  # the workflow applies this automatically; the rest of the settings inherit
  # from "default".
  blender:
    attribution: "Animation: Blender Foundation (CC-BY)"

# Render quality. Old cartoons are often low-res, so clips are upscaled to a
# standard height with lanczos + a light unsharp mask (sharpen) to reduce
# softness, then encoded at a high CRF. target_height 0 = keep source size.
quality:
  target_height: 1080       # upscale every clip to this height (lanczos)
  sharpen: 0.4              # unsharp amount (0 = off) — helps low-res sources
  crf: 17
  preset: slow

# "Subscribe" text burned into the TOP of every clip (the black bar area).
overlay:
  text: "Subscribe for more videos"
  y_fraction: 0.05          # distance from the top as a fraction of height
  fontsize_fraction: 0.045  # text size as a fraction of height
  color: white
  box: true                 # semi-transparent black box behind the text

# Posting / scheduling (YouTube Data API, same OAuth creds as the main
# project). Videos are uploaded PRIVATE with a publishAt time = scheduled:
# invisible until publishAt, then they go live automatically.
schedule:
  clips_per_day: 2
  slot_hours_utc: [12, 18]  # post times (UTC)
  privacy: private          # private + publishAt = "Scheduled" on YouTube
  title_template: "{episode} | Cartoon Clip {n}"
  description: "Classic silent cartoon clip - no talking, all action! New clips drop every day. Subscribe for more! #cartoons #classiccartoons #animation #funny"
  tags: ["cartoons", "classic cartoons", "funny", "animation", "silent",
         "vintage cartoons", "public domain", "cartoon clips", "popeye",
         "looney tunes", "felix the cat", "betty boop", "woody woodpecker",
         "retro animation"]
